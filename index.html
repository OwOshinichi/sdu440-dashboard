<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDU440 Control v7 (Clean UI)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #090d16; --card: #111827; --border: #1f2937; --text: #f3f4f6; --accent: #38bdf8; --success: #4ade80; --warn: #fbbf24; --danger: #f87171; }
        body { font-family: 'Prompt', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; max-width: 600px; margin: auto; }
        h2 { font-size: 1.1rem; color: #cbd5e1; margin-bottom: 20px; border-left: 4px solid var(--accent); padding-left: 10px; }
        .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; padding: 10px; background: #05070f; border-radius: 8px; }
        .label { font-size: 0.9rem; }
        .action { display: flex; align-items: center; gap: 8px; }
        input, select { background: #111827; border: 1px solid var(--border); color: #fff; padding: 6px; border-radius: 4px; font-family: sans-serif; }
        button { background: var(--accent); color: #000; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .tag { font-family: monospace; background: #1f2937; padding: 3px 8px; border-radius: 4px; min-width: 40px; text-align: center; color: #9ca3af; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚙️ ปรับแต่งตู้คอนโทรล (Clean Mode)</h2>
    
    <div class="row">
        <div class="label">ค่าเป้าหมาย (SV)</div>
        <div class="action">
            <span class="tag" id="v-sv">--</span>
            <input type="number" id="i-sv" style="width:70px;">
            <button onclick="send('sv','i-sv')">SET</button>
        </div>
    </div>

    <div class="row" style="border-left: 4px solid var(--danger);">
        <div class="label">การเตือน 1 (ALS1)</div>
        <div class="action">
            <select id="i-als1">
                <option value="0">Off</option><option value="1">High</option><option value="2">Std Hi</option>
                <option value="3">Low</option><option value="4">Std Lo</option><option value="5">Dev Hi</option>
                <option value="6">Dev Lo</option><option value="7">Dev</option><option value="8">Timer</option>
            </select>
            <button onclick="send('als1','i-als1')">SET</button>
            <input type="number" id="i-hys1" placeholder="HyS1" style="width:50px;">
            <button onclick="send('hys1','i-hys1')">SET</button>
        </div>
    </div>

    <div class="row" style="border-left: 4px solid var(--warn);">
        <div class="label">การเตือน 2 (ALS2)</div>
        <div class="action">
            <select id="i-als2">
                <option value="0">Off</option><option value="1">High</option><option value="2">Std Hi</option>
                <option value="3">Low</option><option value="4">Std Lo</option><option value="5">Dev Hi</option>
                <option value="6">Dev Lo</option><option value="7">Dev</option><option value="8">Timer</option>
            </select>
            <button onclick="send('als2','i-als2')">SET</button>
            <input type="number" id="i-hys2" placeholder="HyS2" style="width:50px;">
            <button onclick="send('hys2','i-hys2')">SET</button>
        </div>
    </div>
</div>

<script>
    const broker = "mqtt-dashboard.com";
    const port = 8884;
    const client = new Paho.MQTT.Client(broker, port, "WebControl-" + Math.floor(Math.random()*1000));

    client.connect({ onSuccess: () => {
        client.subscribe("sdu440/telemetry/#");
    }, useSSL: true });

    client.onMessageArrived = (m) => {
        const t = m.destinationName;
        const p = m.payloadString;
        if(t.includes("sv")) document.getElementById("v-sv").innerText = p;
    };

    function send(param, inputId) {
        const val = document.getElementById(inputId).value;
        if(val === "") return;
        const m = new Paho.MQTT.Message(val);
        m.destinationName = "sdu440/command/" + param;
        client.send(m);
        alert("ส่งคำสั่ง " + param + " = " + val + " สำเร็จ");
    }
</script>

</body>
</html>
