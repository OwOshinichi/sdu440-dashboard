<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDU440 Cloud Control Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Prompt:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-color: #f8fafc; --accent-color: #38bdf8; --success-color: #4ade80; }
        body { font-family: 'Prompt', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 800px; }
        header { text-align: center; margin-bottom: 25px; }
        h1 { margin: 0; font-size: 1.8rem; color: var(--accent-color); }
        .status-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; font-weight: bold; margin-top: 8px; background: #ff4757; color: #fff; }
        .connected { background: var(--success-color); color: #000; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
        .card { background-color: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); text-align: center; }
        .value-display { font-family: 'JetBrains+Mono', monospace; font-size: 3.5rem; font-weight: 700; margin: 10px 0; color: var(--success-color); }
        .unit { font-size: 1.5rem; color: #94a3b8; }
        .control-form input[type=number] { background: #0f172a; border: 2px solid #334155; color: #fff; padding: 12px; border-radius: 8px; font-size: 1.2rem; width: 50%; text-align: center; outline: none; font-family: 'JetBrains+Mono', monospace; }
        .control-form input[type=number]:focus { border-color: var(--accent-color); }
        .control-form button { background-color: var(--accent-color); color: #0f172a; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-left: 10px; transition: 0.2s; }
        .control-form button:hover { opacity: 0.9; transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SDU440 IoT Cloud Gateway</h1>
            <div id="status" class="status-badge">กำลังเชื่อมต่อ MQTT...</div>
        </header>
        <div class="grid">
            <div class="card">
                <h3>อุณหภูมิปัจจุบัน (PV)</h3>
                <div class="value-display"><span id="pv-val">--</span><span class="unit">°C</span></div>
            </div>
            <div class="card">
                <h3>ตั้งค่าอุณหภูมิเป้าหมาย (SV)</h3>
                <div class="control-form" style="margin: 20px 0;">
                    <input type=number id="sv-input" placeholder="ระบุ SV">
                    <button onclick="sendSV()">SET</button>
                </div>
                <p style="font-size: 0.9rem; color: #94a3b8;">ค่าปัจจุบันบนบอร์ด: <span id="sv-current" style="color:#fff; font-weight:bold;">--</span> °C</p>
            </div>
        </div>
        <div class="card">
            <h3>กราฟแสดงผลอุณหภูมิแบบ Real-time</h3>
            <canvas id="realtimeChart" style="max-height: 260px;"></canvas>
        </div>
    </div>

    <script>
        // ใช้การเชื่อมต่อสเปกเดียวกับหน้าต่างเทสท์ HiveMQ ที่คุณเปิดติดเป๊ะๆ 
        const broker = "broker.hivemq.com";
        const port = 8000; // กลับมาใช้พอร์ตมาตรฐานของ WebSocket
        const clientId = "WebClient-" + Math.floor(Math.random() * 10000);
        const topicPV = "sdu440/telemetry/pv";
        const topicSV = "sdu440/telemetry/sv";
        const topicCmd = "sdu440/command/sv";

        const client = new Paho.MQTT.Client(broker, port, clientId);
        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;

        // เชื่อมต่อแบบเปิดเผยพอร์ตปกติ ไม่ล็อก SSL ปิดกั้นระบบเครือข่าย
        client.connect({ onSuccess: onConnect, onFailure: onFailure, useSSL: false });

        function onConnect() {
            console.log("MQTT Connected!");
            document.getElementById("status").innerText = "เชื่อมต่อระบบ Cloud สำเร็จ";
            document.getElementById("status").className = "status-badge connected";
            client.subscribe(topicPV);
            client.subscribe(topicSV);
        }

        function onFailure(err) {
            console.log("Connect failed", err);
            document.getElementById("status").innerText = "การเชื่อมต่อล้มเหลว (กำลังลองใหม่อัตโนมัติ...)";
            // หากเชื่อมต่อพอร์ตปกติไม่สำเร็จ ให้ทำการรีคอนเนคแบบออโต้
            setTimeout(function() {
                client.connect({ onSuccess: onConnect, onFailure: onFailure, useSSL: false });
            }, 3000);
        }

        function onConnectionLost(responseObject) {
            document.getElementById("status").innerText = "การเชื่อมต่อหลุด!";
            document.getElementById("status").className = "status-badge";
        }

        function onMessageArrived(message) {
            const payload = message.payloadString;
            const topic = message.destinationName;

            if (topic === topicPV) {
                document.getElementById("pv-val").innerText = payload;
                updateChartData(parseFloat(payload));
            } else if (topic === topicSV) {
                document.getElementById("sv-current").innerText = payload;
            }
        }

        function sendSV() {
            const inputVal = document.getElementById("sv-input").value;
            if (!inputVal) return alert("กรุณากรอกตัวเลขก่อนกดตั้งค่า!");

            const message = new Paho.MQTT.Message(inputVal);
            message.destinationName = topicCmd;
            client.send(message);
            alert("ส่งคำสั่งตั้งค่า SV = " + inputVal + " เรียบร้อยแล้ว!");
            document.getElementById("sv-input").value = "";
        }

        // --- ระบบจัดการกราฟด้วย Chart.js ---
        const ctx = document.getElementById('realtimeChart').getContext('2d');
        const maxDataPoints = 20;
        const chartData = {
            labels: [],
            datasets: [{
                label: 'อุณหภูมิปัจจุบัน (PV)',
                data: [],
                borderColor: '#4ade80',
                backgroundColor: 'rgba(74, 222, 128, 0.05)',
                borderWidth: 2,
                tension: 0.3,
                fill: true
            }]
        };

        const myChart = new Chart(ctx, {
            type: 'line',
            data: chartData,
            options: {
                responsive: true,
                scales: {
                    x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                    y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' }, suggestMin: 15, suggestMax: 45 }
                },
                plugins: { legend: { labels: { color: '#f8fafc' } } }
            }
        });

        function updateChartData(newValue) {
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0') + ':' + now.getSeconds().toString().padStart(2, '0');
            if (chartData.labels.length >= maxDataPoints) {
                chartData.labels.shift();
                chartData.datasets[0].data.shift();
            }
            chartData.labels.push(timeStr);
            chartData.datasets[0].data.push(newValue);
            myChart.update();
        }
    </script>
</body>
</html>
